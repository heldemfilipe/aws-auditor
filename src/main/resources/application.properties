spring.application.name=aws-auditor

# AWS: credenciais SÓ pela cadeia padrão do SDK (variáveis de ambiente, perfil, role). Nada de chave aqui.
auditor.aws.regioes=us-east-1
auditor.aws.retry-max-tentativas=3

# DynamoDB: nome da tabela de achados. O endpoint só se define para rodar contra o DynamoDB Local (ex.: http://localhost:8000).
auditor.dynamodb.tabela=achados

# Varredura em paralelo (threads virtuais) e o teto de chamadas simultâneas à AWS
auditor.varredura.paralela=true
auditor.varredura.paralelismo-maximo=16
